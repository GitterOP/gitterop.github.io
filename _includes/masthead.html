{% comment %}Adapted from Academic Pages; see THIRD_PARTY.md.{% endcomment %}
<header class="masthead">
  <div class="shell masthead__inner-wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — home">
      <span class="brand-mark" aria-hidden="true">jd.</span>
      <span class="brand-name">Juan David <span>Cárdenas Z.</span></span>
    </a>
    <nav aria-label="Main navigation">
      <ul class="navigation">
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme" hidden>
      <svg class="theme-icon theme-icon-sun" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-icon theme-icon-moon" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 13.1A9 9 0 0 1 10.9 3.2a9 9 0 1 0 9.9 9.9Z"/></svg>
      <span class="theme-toggle-label">Light</span>
    </button>
  </div>
</header>
