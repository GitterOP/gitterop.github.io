intro: >-
  I hold a bachelor’s degree in Information Engineering from Universidad del
  Pacífico in Peru, where I worked as a research assistant. My research includes
  building object-based world models for reinforcement learning and adapting
  vision transformers for hyperspectral image classification. I am particularly
  interested in how theories of human learning from psychology and neuroscience
  can guide the design of reinforcement learning algorithms.
academic_background: >-
  I graduated first in my Information Engineering class at Universidad del
  Pacífico, with a cumulative weighted average of 18.18/20. I received the Robert
  Maes Award for ranking first in the degree program in 2021, 2022, and 2023,
  and the Robert Maes Special Award for ranking first in my graduating class
  in 2025-I.
experience_intro: >-
  My research experience spans object-based world models, hyperspectral
  representation learning, and applied data analysis. Across these projects,
  I have contributed to scientific software, experimental design, data
  preparation, analysis, and manuscript writing.
