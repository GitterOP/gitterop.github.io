- id: dreamerv2_objetos
  title: Learning Object-Based World Models in MsPacman with DreamerV2
  short_title: Guiding world models with object information
  authors: "Juan David Cárdenas, Miguel Muñoz, and Junior Fabian"
  year: 2025
  type: conference
  venue: 44th International Conference of the Chilean Computer Science Society (SCCC)
  venue_short: SCCC
  citation: "pp. 1–7"
  doi: 10.1109/SCCC67219.2025.11420437
  pdf: /files/papers/cardenas-2025-object-world-models.pdf
  pdf_label: PDF
  code: https://github.com/GitterOP/DreamerReborn
  featured: true
  field: World models & reinforcement learning
  study_summary: An extension of DreamerV2 that incorporates object information through an additional input channel and reconstructs both images and masks, evaluated in MsPacman with different object categories.
  question: How does explicit object information shape what a world model learns and how its agent behaves?
  approach: DreamerV2 receives a grayscale frame and a binary mask for one object category, with a decoder trained to reconstruct both. The study compares agent, collectible, and enemy masks against the original single-channel baseline in MsPacman.
  personal_contribution: I proposed and designed the object-based extension, integrated OCAtari, carried out the core implementation, and led the experimental design and analysis, with a collaborator and academic supervision.
  contribution_short: Proposed the extension, integrated OCAtari, and led implementation, experiments, and analysis.
  finding: Object categories shaped different learning biases. Collectible information encouraged score-seeking behavior, agent-location information favored survival, and ambiguous enemy information could impair learning. These observations are specific to the MsPacman study.
  finding_source: Conclusions, p. 6 of the paper.
  figure: /assets/images/research/dreamer-object-masks.png
  figure_alt: MsPacman game frame and separate binary object masks for the player, enemies, and collectibles, reproduced from the paper.
  figure_caption: "The game frame and object-category masks used as additional input. Figure 2 from the paper, p. 3."
  bibtex: |
    @inproceedings{cardenas2025objects,
      author = {Cárdenas, Juan David and Muñoz, Miguel and Fabian, Junior},
      title = {Learning Object-Based World Models in {MsPacman} with {DreamerV2}},
      booktitle = {2025 44th International Conference of the Chilean Computer Science Society (SCCC)},
      year = {2025},
      pages = {1--7},
      publisher = {IEEE},
      doi = {10.1109/SCCC67219.2025.11420437}
    }
