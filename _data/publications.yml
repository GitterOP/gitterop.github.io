- id: subset_hsi
  title: "Subset-Driven Representation Learning for Hyperspectral Image Classification: Assessing Latent Space Quality Through Spectral–Spatial and Transformer-Based Models"
  short_title: Learning useful representations from less hyperspectral data
  authors: "Víctor Andrés Ayma Quirita, Víctor Hugo Ayma Quirita, Walter Aliaga, Gilson A. O. P. Costa, and Juan David Cárdenas"
  year: 2026
  type: journal
  venue: IEEE Journal of Selected Topics in Applied Earth Observations and Remote Sensing
  venue_short: IEEE JSTARS
  citation: "19, 30603–30619"
  doi: 10.1109/JSTARS.2026.3727184
  pdf: /files/papers/cardenas-2026-hyperspectral-representations.pdf
  pdf_label: PDF · Accepted author version
  featured: true
  field: Representation learning
  study_summary: A comparison of classical, autoencoder, and transformer-based representations for hyperspectral classification, examining how training fractions and latent dimensions affect performance and computational cost.
  question: How much hyperspectral data is needed to learn representations that remain useful for classification?
  approach: The study compares PCA, AE, AE-Patch, ViT, MAE-ViT, and DINO-ViT across training fractions, latent dimensions, downstream classifiers, and five benchmark datasets.
  personal_contribution: I adapted RGB implementations of ViT, MAE-ViT, and DINO-ViT for training from scratch on hyperspectral data, proposed including MAE, and designed concurrent GPU representation learning and CPU classification. I also prepared visualizations and a manuscript draft under the coauthors’ scientific guidance.
  contribution_short: Adapted transformer models to hyperspectral data and designed concurrent GPU/CPU evaluation.
  finding: Reduced training fractions often preserved competitive classification performance in the evaluated configurations. Full representation-learning partitions could add substantial computational cost for marginal gains; the trade-off depended on the dataset, model, and latent dimension.
  finding_source: Conclusion, p. 16 of the accepted author version.
  figure: /assets/images/research/hyperspectral-methodology.png
  figure_alt: Published methodology showing preparation of hyperspectral subsets, representation learning, feature extraction, classification, and evaluation.
  figure_caption: "The representation-learning and classification pipeline. Figure 2 from the accepted author version, p. 5."
  bibtex: |
    @article{ayma2026subset,
      author = {Ayma Quirita, Victor Andres and Ayma Quirita, Victor Hugo and Aliaga, Walter and Costa, Gilson A. O. P. and Cárdenas, Juan David},
      title = {Subset-Driven Representation Learning for Hyperspectral Image Classification: Assessing Latent Space Quality Through Spectral–Spatial and Transformer-Based Models},
      journal = {IEEE Journal of Selected Topics in Applied Earth Observations and Remote Sensing},
      year = {2026},
      volume = {19},
      pages = {30603--30619},
      doi = {10.1109/JSTARS.2026.3727184}
    }
